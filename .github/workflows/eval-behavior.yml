name: Eval-Behavior (manuell + woechentliches Kern-Set + taeglicher Smoke-Lauf)

# Separat auslösbarer Lauf fuer die Verhaltens-Evals unter tests/evals/ (Issue #470,
# Aufrufweg erweitert in #631, SDK-Pfad seither entfernt -- Issue #716). Bewusst
# NICHT auf push/pull_request verdrahtet: die real gerufenen Evals kosten
# Abo-Kontingent ueber CLAUDE_CODE_OAUTH_TOKEN (~991 Aufrufe fuer einen manuellen
# Vollauf, vgl. docs/evals/STRATEGY.md Abschnitt "API-Budget") -- und sollen nicht
# bei jedem Commit laufen (Issue-Scope "Out"). ci.yml bleibt unangetastet -- der
# reguläre `pytest tests/`-Lauf dort ruft tests/evals/ weiterhin ohne jede Auth auf
# und skippt die real gerufenen Faelle wie bisher (AC7).
#
# Issue #597: zusaetzlich zum manuellen workflow_dispatch (weiterhin voller Satz
# bzw. component-Filter) fuehrt ein woechentlicher `schedule`-Trigger NUR das
# Kern-Set aus (`-m eval_core_set`, Marker registriert in pyproject.toml, sitzt
# an neun Dateien unter tests/evals/ -- siehe docs/evals/STRATEGY.md Abschnitt
# "Geplanter woechentlicher Lauf ueber ein Kern-Set" fuer die vollstaendige
# Liste und die Korrektur zum urspruenglichen Issue-Text).
#
# Korrektur nach Review: das Kern-Set WAR faktisch der Vollauf, weil eine der
# neun Dateien (tests/evals/test_triggers.py) allein ~871 der ~991 Aufrufe
# eines Vollaufs ausmacht (45 Skills x should_trigger/should_not_trigger).
# Seither laeuft test_triggers.py im geplanten Lauf nur noch als deterministisch
# rotierende Stichprobe von 11-12 Skills pro Woche (ISO-Kalenderwoche waehlt
# eine von vier festen Gruppen, siehe ROTATION_GROUPS in test_triggers.py) --
# ueber vier Wochen kommt jeder Skill einmal dran. Das begrenzt test_triggers.py
# auf ~210-235 Aufrufe pro Woche statt ~871; zusammen mit den restlichen acht
# Kern-Set-Dateien (Quality-Evals, unveraendert ~120 Aufrufe) liegt ein
# geplanter Lauf damit bei ~330-355 Aufrufen pro Woche statt vorher ~991 --
# das Kern-Set deckt weiterhin die Suiten mit dem groessten
# Trigger-Recall/FPR-Anteil ab, wo Modell-Drift am ehesten still auffaellt,
# aber eben als Stichprobe statt als Vollauf. Ein Fehlschlag des geplanten
# Laufs erzeugt ein Issue (Report-Step unten) statt in einem ungesehenen
# Actions-Tab zu verpuffen.
#
# Issue #848: zusaetzlich ein zweiter, taeglicher `schedule`-Cron fuer eine
# feste, kleine Smoke-Stichprobe (`SMOKE_SET_NODE_IDS` in
# tests/evals/smoke_set.py, docs/evals/STRATEGY.md Abschnitt "Taeglicher
# Smoke-Lauf"), damit ein Modell-Drift in einer gerade nicht rotierten
# Kern-Set-Gruppe nicht bis zu drei Wochen unentdeckt bleibt. Zwei
# `schedule`-Eintraege liefern beide `github.event_name == 'schedule'` --
# die Job-Logik unterscheidet ueber `github.event.schedule` (den konkreten
# Cron-String), s. WEEKLY_CRON unten.
on:
  schedule:
    # Montag 07:00 UTC -- eine Stunde nach live-fetch-weekly.yml (Montag
    # 06:00 UTC), um Runner-Kontention zu vermeiden (Plan-Kommentar zu #597).
    - cron: "0 7 * * 1"
    # Taeglich 05:00 UTC -- vor dem woechentlichen Kern-Set-Lauf, damit ein
    # Montag beide Laeufe unabhaengig voneinander sieht (Issue #848).
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      component:
        description: >-
          Optional: nur Tests filtern, deren Name dieses Muster enthaelt
          (pytest -k), z.B. ein einzelner evals/-Komponentenname. Leer = alle
          Verhaltens-Evals unter tests/evals/. Gilt nur fuer den manuellen
          Lauf -- der geplante Lauf (schedule) ignoriert diesen Input und
          nutzt immer das Kern-Set (-m eval_core_set).
        required: false
        default: ""
      trigger_rotation_group:
        description: >-
          Optional: fuer tests/evals/test_triggers.py (der API-teuerste Teil
          des Kern-Sets) eine feste Rotationsgruppe erzwingen -- "0".."3" fuer
          genau diese Gruppe, "all" fuer den vollen 45-Skill-Satz. Leer =
          automatisches Verhalten: der geplante Lauf waehlt die Gruppe ueber
          die ISO-Kalenderwoche, ein manueller Lauf ohne diesen Input bekommt
          weiterhin alle Skills (wie vor Issue #597). Wirkt nur auf
          test_triggers.py -- die restlichen acht Kern-Set-Dateien filtert
          dieser Input nicht.
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: eval-behavior-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval-behavior:
    name: Verhaltens-Evals real ausfuehren
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    # Harter Budget-Deckel (Issue #470 AC2): der CLI-Pfad (Issue #631, seit
    # #716 einziger Aufrufweg) ist pro Aufruf teuer -- der reale Probelauf im
    # PR #631 maß ~6s/Aufruf inkl. Agenten-Scaffold-Cache-Erstellung, macht
    # 991 Aufrufe ~99min. 60 Minuten reichen fuer den CLI-Pfad bei diesem
    # Volumen knapp nicht aus -- der `component`-Filter-Input existiert genau
    # dafuer.
    #
    # Issue #597: der geplante Lauf (schedule) fuehrt nur das Kern-Set aus
    # (s. eval_core_set-Marker). Review-Korrektur: das Kern-Set war anfangs
    # de facto der Vollauf, weil test_triggers.py allein alle 871 Trigger-
    # Faelle zog. Seither rotiert test_triggers.py woechentlich durch eine von
    # vier festen 11-12-Skill-Gruppen (ISO-Kalenderwoche waehlt die Gruppe,
    # s. Kopfkommentar oben) -- ein geplanter Lauf zieht dadurch nur noch
    # ~330-355 API-Aufrufe (~210-235 aus der Rotationsgruppe + ~120 aus den
    # restlichen acht Kern-Set-Dateien) statt ~991. Auf dem CLI-Pfad
    # (Issue #631, ~6s/Aufruf) sind das ~35min, nicht ~99min -- die 120
    # Minuten unten sind seit der Rotation grosszuegiger Puffer, kein knapper
    # Deckel mehr, aber unveraendert belassen, um bei einem manuell
    # erzwungenen "all"-Override (trigger_rotation_group) weiterhin Raum fuer
    # einen vollen CLI-Pfad-Lauf zu haben. Der manuelle Lauf (workflow_dispatch,
    # ggf. component-Filter) behaelt die bestehenden 60 Minuten.
    # `timeout-minutes` akzeptiert Ausdruecke nur ueber github/inputs/vars-
    # Kontexte -- reicht hier, weil nur github.event_name/github.event.schedule
    # gebraucht wird. Issue #848: dritter Zweig fuer den taeglichen
    # Smoke-Cron ("0 5 * * *") -- acht Faelle brauchen kein 120-Minuten-
    # Budget wie der Kern-Set-Lauf, 20 Minuten sind grosszuegiger Puffer
    # (s. docs/evals/STRATEGY.md, Abschnitt "Taeglicher Smoke-Lauf").
    timeout-minutes: >-
      ${{ github.event.schedule == '0 5 * * *' && 20
       || (github.event_name == 'schedule' && 120 || 60) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-python-uv
        with:
          python-version: "3.12"

      - name: Vorbedingung -- CLAUDE_CODE_OAUTH_TOKEN muss gesetzt sein
        # Kein taeuschend gruener All-Skip-Lauf (das genaue Problem, das #470
        # behebt): fehlt das Secret, bricht der Job sichtbar ab statt
        # "0 failed, N skipped" als Erfolg zu melden. Seit Issue #716 ist die
        # OAuth-Session (Issue #631) der einzige Aufrufweg -- der frueher
        # parallele ANTHROPIC_API_KEY-Pfad ist entfernt.
        env:
          HAS_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_OAUTH_TOKEN}" != "true" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN ist nicht als Repo-Secret hinterlegt. Dieser Lauf wuerde sonst taeuschend gruen durchlaufen (0 real geprueft, N geskippt) -- genau das Muster, das Issue #470 behebt. Secret ist Operator-Entscheidung (docs/evals/STRATEGY.md, Abschnitt API-Budget)."
            exit 1
          fi

      - name: claude-CLI installieren (OAuth-Aufrufweg, Issue #631/#716)
        # Nur noetig fuer den CLI-Subprozess-Pfad in eval_runner.py -- seit
        # #716 der einzige Aufrufweg, daher immer installiert (kein
        # bedingter Skip mehr).
        run: npm install -g @anthropic-ai/claude-code

      - name: pytest tests/evals/ (real, ueber OAuth-Session)
        id: run_evals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ueber env: binden statt direkt in run: zu templaten: inputs.component
          # ist untrusted (jeder mit workflow_dispatch-Trigger-Recht setzt ihn frei).
          # Direkte ${{ }}-Interpolation im Skripttext waere Shell-Injection mit
          # Zugriff auf ANTHROPIC_API_KEY im selben Step.
          FILTER: ${{ inputs.component }}
          # Issue #597: nur der geplante Lauf ist auf das Kern-Set eingeschraenkt.
          # inputs.component bleibt fuer workflow_dispatch unveraendert nutzbar --
          # beide Filter (-m/-k) sind pytest-seitig unabhaengig kombinierbar,
          # hier aber bewusst exklusiv (schedule ignoriert inputs.component,
          # s. Beschreibung des Inputs oben).
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
          # Issue #848: unterscheidet die beiden `schedule`-Cron-Eintraege --
          # github.event_name allein reicht dafuer nicht mehr (beide liefern
          # 'schedule').
          IS_SMOKE_SCHEDULE: ${{ github.event.schedule == '0 5 * * *' }}
          # Wie FILTER oben: ueber env: binden statt direkt zu templaten --
          # inputs.trigger_rotation_group ist derselbe untrusted Input-Typ.
          ROTATION_GROUP_INPUT: ${{ inputs.trigger_rotation_group }}
        run: |
          set -euo pipefail
          # EVAL_TRIGGER_ROTATION_GROUP steuert die Skill-Auswahl in
          # tests/evals/test_triggers.py (s. Modul-Kommentar dort). Der
          # woechentliche Kern-Set-Lauf waehlt ohne expliziten Override
          # automatisch die ISO-Kalenderwoche-Gruppe ("auto"); der taegliche
          # Smoke-Lauf (Issue #848) erzwingt IMMER "all", weil die drei fest
          # gewaehlten Smoke-Skills unabhaengig von der Wochen-Rotation
          # kollektierbar sein muessen (s. tests/evals/smoke_set.py);
          # jeder andere Lauf (manuell, oder geplant MIT explizitem Override)
          # reicht den Input unveraendert durch -- leer bedeutet dort
          # weiterhin "alle Skills" (Verhalten vor Issue #597).
          if [ "${IS_SMOKE_SCHEDULE}" = "true" ]; then
            export EVAL_TRIGGER_ROTATION_GROUP="all"
          elif [ "${IS_SCHEDULED}" = "true" ] && [ -z "${ROTATION_GROUP_INPUT}" ]; then
            export EVAL_TRIGGER_ROTATION_GROUP="auto"
          else
            export EVAL_TRIGGER_ROTATION_GROUP="${ROTATION_GROUP_INPUT}"
          fi
          if [ "${IS_SMOKE_SCHEDULE}" = "true" ]; then
            # Issue #848: feste Node-ID-Stichprobe statt Datei-/Marker-Filter
            # -- SMOKE_SET_NODE_IDS in tests/evals/smoke_set.py ist die eine
            # Quelle der Wahrheit, hier nur ausgelesen und an pytest als
            # Positionsargumente uebergeben (kein `-k`-Ausdruck noetig).
            SMOKE_IDS_RAW=$(uv run python -c \
              "from tests.evals.smoke_set import SMOKE_SET_NODE_IDS; print('\n'.join(SMOKE_SET_NODE_IDS))")
            mapfile -t SMOKE_NODE_IDS <<<"${SMOKE_IDS_RAW}"
            if [ "${#SMOKE_NODE_IDS[@]}" -eq 0 ]; then
              echo "::error::Smoke-Set leer -- kein Test haette gelaufen, Fehlschlag ist verschleiert"
              exit 1
            fi
            uv run pytest "${SMOKE_NODE_IDS[@]}" -v \
              --junitxml=eval-results.xml 2>&1 | tee eval-output.log
          elif [ "${IS_SCHEDULED}" = "true" ]; then
            uv run pytest tests/evals/ -m eval_core_set -v \
              --junitxml=eval-results.xml 2>&1 | tee eval-output.log
          elif [ -n "${FILTER}" ]; then
            uv run pytest tests/evals/ -k "${FILTER}" -v \
              --junitxml=eval-results.xml 2>&1 | tee eval-output.log
          else
            uv run pytest tests/evals/ -v \
              --junitxml=eval-results.xml 2>&1 | tee eval-output.log
          fi

      - name: Ergebnis nach GITHUB_STEP_SUMMARY schreiben
        if: always()
        run: |
          set -euo pipefail
          echo "## Verhaltens-Evals -- Ergebnis" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ -f eval-results.xml ]; then
            python3 scripts/dev/summarize_eval_junit.py eval-results.xml >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**eval-results.xml wurde nicht erzeugt -- Lauf ist vorzeitig abgebrochen.**" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Skip-Inventar gegen den Lauf pruefen (Issue #824)
        # Der bestehende Zaehl-Guard (tests/evals/test_eval_strategy.py::
        # test_skip_count_matches_real_pytest_run) schaltet sich ab, sobald die
        # claude-CLI verfuegbar ist -- also genau hier. Ein neuer Dauer-Skip
        # bliebe damit unsichtbar (Muster Issue #470: "taeuschend gruen, 0 real
        # geprueft, N geskippt"). Dieser Schritt haelt die tatsaechliche
        # Skip-Menge der vault-abhaengigen Suiten gegen das dokumentierte
        # Inventar in tests/evals/skip_inventory.py und faerbt den Lauf rot,
        # sobald sie sich in eine der beiden Richtungen aendert.
        if: always()
        run: |
          set -o pipefail
          if [ ! -f eval-results.xml ]; then
            echo "eval-results.xml fehlt -- Skip-Inventar nicht pruefbar (Lauf vorzeitig abgebrochen)."
            exit 0
          fi
          {
            echo
            echo "### Skip-Inventar (Issue #824)"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          uv run python scripts/dev/check_eval_skip_inventory.py eval-results.xml 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Fehlschlaege als Issue melden (nur geplanter Lauf, dedupliziert)
        # Nur der geplante Lauf meldet automatisch -- ein manueller
        # workflow_dispatch-Lauf (z.B. gezielter Nachvollzug eines bekannten
        # Fehlschlags) soll nicht bei jedem Fehlschlag ein weiteres Issue
        # aufmachen (Issue #597, AC4 spricht explizit vom "geplanten Lauf").
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          bash scripts/ci/report_eval_behavior_failure.sh eval-results.xml "$RUN_URL"

      - name: Ergebnis-Artefakte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-behavior-results
          path: |
            eval-results.xml
            eval-output.log
          retention-days: 30
          if-no-files-found: warn
