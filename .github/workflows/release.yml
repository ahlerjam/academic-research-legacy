name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  version-match:
    name: Manifest-Version == Tag
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Tag vs. plugin.json-Version vergleichen
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST="$(jq -r '.version' .claude-plugin/plugin.json)"
          echo "Tag:      $TAG"
          echo "Manifest: $MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag ($TAG) stimmt nicht mit plugin.json version ($MANIFEST) ueberein."
            exit 1
          fi
          echo "Version stimmt ueberein."
      - name: marketplace.json-Version vs. plugin.json vergleichen
        run: |
          set -euo pipefail
          PLUGIN="$(jq -r '.version' .claude-plugin/plugin.json)"
          MARKET="$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)"
          echo "plugin.json:      $PLUGIN"
          echo "marketplace.json: $MARKET"
          if [ "$PLUGIN" != "$MARKET" ]; then
            echo "::error::marketplace.json plugins[0].version ($MARKET) stimmt nicht mit plugin.json version ($PLUGIN) ueberein."
            exit 1
          fi
          echo "Marketplace-Version stimmt ueberein."
      - name: pyproject.toml-Version vs. plugin.json vergleichen
        run: |
          set -euo pipefail
          PLUGIN="$(jq -r '.version' .claude-plugin/plugin.json)"
          PYPROJECT="$(grep -m1 '^version' pyproject.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          echo "plugin.json:    $PLUGIN"
          echo "pyproject.toml: $PYPROJECT"
          if [ "$PLUGIN" != "$PYPROJECT" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT) stimmt nicht mit plugin.json version ($PLUGIN) ueberein."
            exit 1
          fi
          echo "pyproject.toml-Version stimmt ueberein."

  marketplace-notice:
    name: Marketplace-Update-Notice
    needs: version-match
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Hinweis zum Marketplace-Refresh ausgeben
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "::notice::Release v${TAG} getaggt. Marketplace-Quelle ist './' (lokal im Repo);"
          echo "::notice::der Marketplace-Refresh erfolgt automatisch beim naechsten Plugin-Sync."
          echo "Release ${GITHUB_REF_NAME} bereit — Manifest-Versionen geprueft." >> "$GITHUB_STEP_SUMMARY"
